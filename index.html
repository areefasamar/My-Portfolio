<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Areefa Samar — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #14121a;
    --ink: #f3ece3;
    --ink-dim: #cbbfc6;
    --ink-faint: #8d8391;
    --maroon: #7a2e42;
    --maroon-bright: #b0475f;
    --amber: #f2c17a;
    --blush: #e8b4c8;
    --sage: #8ea888;
    --line: rgba(243,236,227,0.14);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
    width: 100%;
    height: 100%;
  }

  /* ================= START SCREEN ================= */
  .start-screen{
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(60% 50% at 50% 45%, rgba(122,46,66,0.45) 0%, rgba(20,18,26,0) 70%),
      radial-gradient(40% 35% at 50% 55%, rgba(232,180,200,0.08) 0%, rgba(20,18,26,0) 70%),
      var(--bg);
    transition: opacity 0.9s ease, visibility 0.9s ease;
  }
  .start-screen.hidden{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .start-inner{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 34px;
    text-align: center;
  }

  .start-mark{
    font-family: 'Fraunces', serif;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .start-mark::before,
  .start-mark::after{
    content:'';
    width: 24px;
    height: 1px;
    background: var(--line);
  }

  .start-btn{
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background: rgba(243,236,227,0.05);
    border: 1px solid rgba(243,236,227,0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: 0.04em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .4s ease, border-color .4s ease, transform .4s ease, box-shadow .4s ease;
  }
  .start-btn:hover{
    background: rgba(242,193,122,0.1);
    border-color: var(--amber);
    color: var(--amber);
    transform: scale(1.04);
  }
  .start-btn:active{ transform: scale(0.97); }

  .start-btn-ring{
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 1px solid rgba(242,193,122,0.35);
    animation: ringPulse 2.6s ease-out infinite;
  }
  @keyframes ringPulse{
    0%{ transform: scale(0.94); opacity: 0.9; }
    80%{ transform: scale(1.18); opacity: 0; }
    100%{ transform: scale(1.18); opacity: 0; }
  }

  /* ================= HERO ================= */
  .hero{
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
    background: var(--bg);
  }

  /* ---- background blurred video layer ---- */
  .video-bg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(50px) saturate(1.15) brightness(0.55);
    transform: scale(1.2);
    z-index: 0;
  }

  /* ---- sharp foreground video ---- */
  .video-fg{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    z-index: 1;
  }

  /* ---- warm gradient overlay for legibility ---- */
  .overlay{
    position: absolute;
    inset: 0;
    z-index: 2;
    background:
      linear-gradient(180deg, rgba(20,18,26,0.55) 0%, rgba(20,18,26,0.05) 28%, rgba(20,18,26,0.15) 55%, rgba(20,18,26,0.85) 100%),
      linear-gradient(90deg, rgba(20,18,26,0.55) 0%, rgba(20,18,26,0.05) 35%, rgba(20,18,26,0.05) 65%, rgba(20,18,26,0.6) 100%);
    pointer-events: none;
  }

  /* ---- top bar ---- */
  .topbar{
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px clamp(20px, 5vw, 56px) 0;
  }

  .mark{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--ink);
    display:flex;
    align-items:center;
    gap: 10px;
    opacity: 0;
  }
  .mark::before{
    content:'';
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 10px 2px rgba(242,193,122,0.55);
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    opacity: 0;
  }
  .status .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--sage);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(0.7); }
  }

  /* ---- content overlay ---- */
  .content{
    position: absolute;
    left: clamp(20px, 5vw, 56px);
    bottom: 132px;
    z-index: 5;
    max-width: 640px;
  }

  .eyebrow{ overflow:hidden; }
  .eyebrow span{
    display:inline-block;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--amber);
    transform: translateY(120%);
  }

  .name{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(44px, 8vw, 92px);
    line-height: 0.95;
    letter-spacing: -0.01em;
    margin-top: 14px;
    color: var(--ink);
    text-shadow: 0 2px 30px rgba(0,0,0,0.35);
  }
  .name .line{ overflow: hidden; display:block; }
  .name .line span{ display:inline-block; transform: translateY(115%); }
  .name .line em{
    font-style: normal;
    font-weight: 500;
    color: var(--blush);
  }

  .tagline{
    margin-top: 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 12px;
    font-size: clamp(11px, 1.3vw, 13px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    opacity: 0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .tagline .dot{
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
  }

  /* ---- bottom controls row ---- */
  .controls-row{
    position: absolute;
    left: clamp(20px, 5vw, 56px);
    bottom: 40px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
  }

  .glass-btn{
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(243,236,227,0.08);
    border: 1px solid rgba(243,236,227,0.18);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display:flex; align-items:center; justify-content:center;
    cursor: pointer;
    transition: background .3s ease, border-color .3s ease, transform .3s ease;
    color: var(--ink);
  }
  .glass-btn:hover{
    background: rgba(242,193,122,0.18);
    border-color: var(--amber);
    transform: translateY(-2px);
  }
  .glass-btn svg{ width: 16px; height: 16px; }

  /* ---- email button, bottom-right ---- */
  .email-btn{
    position: absolute;
    right: clamp(20px, 5vw, 56px);
    bottom: 40px;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--ink);
    text-decoration: none;
    background: rgba(243,236,227,0.08);
    border: 1px solid rgba(243,236,227,0.2);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 13px 22px;
    border-radius: 999px;
    opacity: 0;
    transition: background .35s ease, border-color .35s ease, transform .35s ease, color .35s ease;
  }
  .email-btn:hover{
    background: var(--maroon-bright);
    border-color: var(--maroon-bright);
    color: var(--ink);
    transform: translateY(-2px);
  }
  .email-btn svg{ width: 14px; height: 14px; flex-shrink: 0; }

  /* ---- scroll cue, bottom center ---- */
  .scroll-cue{
    position: absolute;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    z-index: 5;
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 8px;
    opacity: 0;
    cursor: pointer;
  }
  .scroll-cue .label{
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .scroll-cue .line{
    width: 1px;
    height: 40px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .scroll-cue .line::after{
    content:'';
    position: absolute;
    top:-100%; left:0;
    width:100%; height:100%;
    background: linear-gradient(var(--amber), var(--maroon-bright));
    animation: cueMove 2s ease-in-out infinite;
  }
  @keyframes cueMove{
    0%{ top:-100%; }
    60%{ top:100%; }
    100%{ top:100%; }
  }

  @media (max-width: 640px){
    .content{ bottom: 200px; }
    .name{ font-size: clamp(38px, 11vw, 60px); }
    .email-btn{ padding: 11px 16px; font-size: 11px; }
    .email-btn span.full{ display:none; }
    .scroll-cue{ display:none; }
    .start-btn{ width: 108px; height: 108px; font-size: 15px; }
  }
</style>
</head>
<body>

<!-- ================= START GATE ================= -->
<div class="start-screen" id="startScreen">
  <div class="start-inner">
    <div class="start-mark">Areefa Samar</div>
    <button class="start-btn" id="startBtn" aria-label="Explore site with sound">
      <span class="start-btn-ring"></span>
      <span>Explore</span>
    </button>
  </div>
</div>

<section class="hero">
  <video class="video-bg" src="assets/areefa-hero.mp4" muted loop playsinline preload="auto"></video>
  <video id="fgVideo" class="video-fg" src="assets/areefa-hero.mp4" muted loop playsinline preload="auto"></video>
  <div class="overlay"></div>

  <div class="topbar">
    <div class="mark">Areefa Samar</div>
    <div class="status">
      <span class="dot"></span>
      <span>Karachi · Open to work</span>
    </div>
  </div>

  <div class="content">
    <div class="eyebrow"><span>CS &amp; IT Student · NED University '29</span></div>
    <h1 class="name">
      <span class="line"><span>Areefa</span></span>
      <span class="line"><span><em>Samar</em></span></span>
    </h1>
    <p class="tagline">
      <span>AI Integration</span><span class="dot"></span><span>Full-Stack Web</span><span class="dot"></span><span>UI/UX Design</span>
    </p>
  </div>

  <div class="controls-row">
    <button class="glass-btn" id="playPauseBtn" aria-label="Pause video">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button class="glass-btn" id="muteBtn" aria-label="Mute video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>
    </button>
  </div>

  <a href="mailto:samarareefa@gmail.com" class="email-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    <span class="full">Email me</span>
  </a>

  <div class="scroll-cue" onclick="document.getElementById('about')?.scrollIntoView({behavior:'smooth'})">
    <div class="line"></div>
    <div class="label">Scroll</div>
  </div>
</section>

<section id="about" style="height:10px; background: var(--bg);"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
  const fgVideo = document.getElementById('fgVideo');
  const bgVideo = document.querySelector('.video-bg');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const muteBtn = document.getElementById('muteBtn');
  const startScreen = document.getElementById('startScreen');
  const startBtn = document.getElementById('startBtn');

  const unmutedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a9 9 0 0 1 0 12"/></svg>';
  const mutedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>';

  let isMuted = true;
  let isPlaying = false;

  function setMuteUI(muted){
    isMuted = muted;
    fgVideo.muted = muted;
    muteBtn.innerHTML = muted ? mutedIcon : unmutedIcon;
    muteBtn.setAttribute('aria-label', muted ? 'Unmute video' : 'Mute video');
  }

  /* ---------- Start gate: single gesture unlocks video + sound together ---------- */
  startBtn.addEventListener('click', () => {
    // This click is a genuine user gesture, so unmuted playback is allowed
    // by every major browser — video and sound start in the same instant.
    fgVideo.currentTime = 0;
    bgVideo.currentTime = 0;
    fgVideo.play();
    bgVideo.play();
    setMuteUI(false);
    isPlaying = true;
    playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';

    startScreen.classList.add('hidden');

    // Entrance sequence plays right after the visitor enters, not before.
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl.to('.mark', { opacity: 1, duration: 0.8 }, 0.1)
      .to('.status', { opacity: 1, duration: 0.8 }, 0.2)
      .to('.eyebrow span', { y: '0%', duration: 0.9 }, 0.4)
      .to('.name .line span', { y: '0%', duration: 1.1, stagger: 0.12 }, 0.55)
      .to('.tagline', { opacity: 1, duration: 0.9 }, 1.1)
      .to('.controls-row', { opacity: 1, duration: 0.8 }, 1.25)
      .to('.email-btn', { opacity: 1, duration: 0.8 }, 1.3)
      .to('.scroll-cue', { opacity: 1, duration: 0.8 }, 1.4);
  }, { once: true });

  /* ---------- manual controls after entry ---------- */
  muteBtn.addEventListener('click', () => setMuteUI(!isMuted));

  playPauseBtn.addEventListener('click', () => {
    if (isPlaying){
      fgVideo.pause(); bgVideo.pause();
      playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      playPauseBtn.setAttribute('aria-label', 'Play video');
    } else {
      fgVideo.play(); bgVideo.play();
      playPauseBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
      playPauseBtn.setAttribute('aria-label', 'Pause video');
    }
    isPlaying = !isPlaying;
  });
</script>

</body>
</html>
